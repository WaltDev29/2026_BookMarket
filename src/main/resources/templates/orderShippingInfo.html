<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 배송 정보 입력</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<main>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <a href="/BookMarket/home" class="d-flex align-items-center text-body-emphasis text-decoration-none">
                <img th:src="@{/images/book_icon.png}" width="100" alt="메인 아이콘">&nbsp;&nbsp;
                <span class="fs-4">BookMarket</span>
            </a>
        </header>

        <div class="p-5 mb-4 bg-body-tertiary rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">주문 배송 정보</h1>
                <p class="col-md-8 fs-4">BookMarket</p>
            </div>
        </div>
        <div class="row align-items-md-stretch">
            <form th:action="@{/order/orderShippingInfo}" method="post" th:object="${shipping}">
                <legend>배송 세부 정보 입력</legend>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">성명</label>
                    <div class="col-sm-3">
                        <input type="text" name="name" class="form-control" th:field="*{name}"/>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">배송일</label>
                    <div class="col-sm-3">
                        <input type="text" name="date" class="form-control" th:field="*{date}" placeholder="yyyy/MM/dd"/>
                    </div>
                    <div class="col-sm-6">
                        <p class="text-danger" th:errors="*{date}"/>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">국가명</label>
                    <div class="col-sm-3">
                        <input type="text" name="address.country" class="form-control" th:field="*{address.country}"/>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">우편번호</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" name="address.zipcode" th:field="*{address.zipcode}">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">기본주소</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" size="50" name="address.addressname" th:field="*{address.addressname}">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">상세주소</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" size="50" name="address.detailname" th:field="*{address.detailname}">
                    </div>
                </div>
                <div class="mb-3 row">
                    <div class="col-sm-offset-2 col-sm-10">
                        <input type="Submit" class="btn btn-primary" value="배송정보등록"/>
                        <a href="/order/orderCancelled" class="btn btn-secondary" role="button">취소</a>
                    </div>
                </div>
            </form>
        </div>

        <footer class="pt-3 mt-4 text-body-secondary border-top">
            <span class="text-body-secondary">&copy;2026 BookMarket</span>
        </footer>
    </div>
</main>
</body>
</html>
